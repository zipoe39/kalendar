    <meta name="apple-mobile-web-app-capable" content="yes">

    <meta name="apple-mobile-web-app-title" content="Kalendář">
    <title>Můj kalendář těšení a úkolů</title>
    <style>
        :root {
            --bg-color: #000000;
            --year-bg: #000000;       
            --month-bg: #222228;      
            --card-bg: #121214;       
            --input-bg: #111111;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-pink: #facc15;
            --accent-green: #facc15;
            --accent-yellow: #facc15;
            --accent-blue: #38bdf8;
            --border-color: #52525b;  
            --highlight-bg: #1e1b10;  
            --highlight-border: #facc15;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(20px, env(safe-area-inset-bottom));
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            display: flex;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #facc15, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .year-section {
            background-color: var(--year-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 40px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 2px solid var(--border-color);
        }

        .year-section:last-child {
            margin-bottom: 20px;
        }

        .year-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            letter-spacing: 0.5px;
            color: #ffffff; 
            background: linear-gradient(to right, #ffffff, #facc15);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .month-section {
            background: var(--month-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .month-section:last-child {
            margin-bottom: 0;
        }

        .month-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-group {
            margin-bottom: 12px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
        }

        .item-group.highlighted-event {
            background: var(--highlight-bg);
            border: 2px solid var(--highlight-border);
        }

        .item-group:last-child {
            margin-bottom: 0;
        }

        .event-main-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .event-date-badge {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: monospace;
            flex-shrink: 0;
        }

        .editable-text {
            font-weight: 600;
            font-size: 1rem;
            color: #e2e8f0;
            flex-grow: 1;
            min-width: 0;
            word-break: break-word;
        }

        .event-sub-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 10px;
            margin-bottom: 8px;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .event-sub-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #3f3f46;
            transition: all 0.2s ease;
        }

        .task-item:hover {
            border-color: #52525b;
            background: rgba(255, 255, 255, 0.05);
        }

        .task-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-pink);
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-item label {
            cursor: pointer;
            font-size: 0.9rem;
            flex-grow: 1;
            user-select: none;
            word-break: break-word;
        }

        .task-item input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        button {
            touch-action: manipulation;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal-box {
            background: #1c1c1e;
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #3a3a3c;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            box-sizing: border-box;
            margin: auto;
        }

        .modal-box h2 {
            margin-top: 0;
            margin-bottom: 16px;
            font-size: 1.3rem;
            color: #ffffff;
        }

        .modal-box label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: #d1d5db;
            font-weight: 500;
        }

        .modal-box input[type="text"],
        .modal-box select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #2c2c2e;
            color: #ffffff;
            border: 1px solid #48484a;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .modal-box input[type="text"]:focus,
        .modal-box select:focus {
            border-color: var(--accent-pink);
        }

        .modal-box input::placeholder {
            color: #8e8e93;
        }

        .date-picker-wrapper {
            position: relative;
            width: 100%;
        }

        .date-input-trigger {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: #2c2c2e;
            color: #ffffff;
            border: 1px solid #48484a;
            box-sizing: border-box;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .date-input-trigger:hover {
            border-color: var(--accent-pink);
        }

        .date-picker-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            width: 100%;
            max-width: 340px;
            background: #1c1c1e;
            border: 1px solid #3a3a3c;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 1100;
            padding: 16px;
            box-sizing: border-box;
            color: #ffffff;
        }

        .dp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .dp-nav-btn {
            background: none;
            border: none;
            color: #d1d5db;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .dp-nav-btn:hover {
            background: #2c2c2e;
            color: #ffffff;
        }

        .dp-mode-switch {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            background: #2c2c2e;
            padding: 4px;
            border-radius: 8px;
        }

        .dp-mode-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .dp-mode-btn.active {
            background: var(--accent-pink);
            color: #000000;
        }

        .dp-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .dp-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .dp-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            color: #ffffff;
            background: transparent;
            border: none;
        }

        .dp-day:hover {
            background: #2c2c2e;
        }

        .dp-day.muted {
            color: #6b7280;
        }

        .dp-day.selected {
            background: #38bdf8 !important;
            color: #000000 !important;
            font-weight: bold;
        }

        .dp-day.in-range {
            background: rgba(56, 189, 248, 0.2);
            color: #ffffff;
            border-radius: 0;
        }

        .dp-day.range-start {
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
            background: #38bdf8 !important;
            color: #000000 !important;
            font-weight: bold;
        }

        .dp-day.range-end {
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
            background: #38bdf8 !important;
            color: #000000 !important;
            font-weight: bold;
        }

        .dp-footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #3a3a3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dp-apply-btn {
            background: var(--accent-pink);
            color: #000000;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
                padding-top: max(8px, env(safe-area-inset-top));
                padding-bottom: max(16px, env(safe-area-inset-bottom));
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));
            }
            h1 { font-size: 1.5rem; }
            .year-section { padding: 12px; margin-bottom: 28px; }
            .year-title { font-size: 1.2rem; }
            .month-section { padding: 10px; }

            .header-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .header-buttons button {
                width: 100%;
                padding: 13px 16px;
                font-size: 1rem;
            }

            .event-main-row {
                gap: 8px;
            }
            .editable-text {
                font-size: 0.95rem;
            }

            .event-sub-row {
                flex-wrap: wrap;
                justify-content: flex-start;
            }
            .event-sub-row button {
                flex: 1 1 auto;
                min-height: 38px;
                padding: 8px 10px;
                font-size: 0.82rem;
            }

            .task-item {
                padding: 10px;
            }
            .task-item input[type="checkbox"] {
                width: 21px;
                height: 21px;
            }
            .task-item label {
                font-size: 0.92rem;
            }

            .modal-box {
                padding: 18px;
                border-radius: 14px;
            }
            .modal-box input[type="text"],
            .modal-box select,
            .date-input-trigger {
                padding: 13px 12px;
                font-size: 16px;
            }

            .date-picker-dropdown {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: calc(100% - 32px);
                max-width: 340px;
                max-height: 80vh;
                overflow-y: auto;
                box-shadow: 0 0 0 100vw rgba(0, 0, 0, 0.7);
            }
        }

        @media (max-width: 380px) {
            h1 { font-size: 1.3rem; }
            .year-title { font-size: 1.05rem; }
            .header-buttons button { font-size: 0.9rem; padding: 12px 14px; }
            .event-sub-row button { font-size: 0.78rem; padding: 7px 8px; }
        }
    </style>
</head>
<body>

<div class="container" id="calendarContainer">
    <header>
        <h1>Kalendář</h1>
        <div class="header-buttons">
            <button id="addEventBtn" style="background: linear-gradient(to right, #facc15, #818cf8); color: #000000; border: none; padding: 10px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);">+ Přidat událost / úkol</button>
            <button id="analyticsBtn" style="background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent-blue); color: var(--accent-blue); padding: 10px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">Volná okna</button>
        </div>
    </header>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const addEventBtn = document.getElementById("addEventBtn");
        const analyticsBtn = document.getElementById("analyticsBtn");
        
        const addModal = document.getElementById("addModal");
        const modalCancel = document.getElementById("modalCancel");
        const modalSave = document.getElementById("modalSave");
        const modalType = document.getElementById("modalType");
        const taskFieldContainer = document.getElementById("taskFieldContainer");

        const subtaskModal = document.getElementById("subtaskModal");
        const subtaskCancel = document.getElementById("subtaskCancel");
        const subtaskSave = document.getElementById("subtaskSave");
        const subtaskTextInput = document.getElementById("subtaskTextInput");
        
        const analyticsModal = document.getElementById("analyticsModal");
        const analyticsClose = document.getElementById("analyticsClose");
        const analyticsContent = document.getElementById("analyticsContent");

        let activeGroupIdForSubtask = null;

        modalType.addEventListener("change", () => {
            if (modalType.value === "event") {
                taskFieldContainer.style.display = "none";
            } else {
                taskFieldContainer.style.display = "block";
            }
        });

        addEventBtn.addEventListener("click", () => { addModal.style.display = "flex"; });
        modalCancel.addEventListener("click", () => { addModal.style.display = "none"; });
        subtaskCancel.addEventListener("click", () => {
            subtaskModal.style.display = "none";
            subtaskTextInput.value = "";
            activeGroupIdForSubtask = null;
        });
        analyticsClose.addEventListener("click", () => { analyticsModal.style.display = "none"; });

        subtaskSave.addEventListener("click", () => {
            const subText = subtaskTextInput.value.trim();
            if (subText && activeGroupIdForSubtask) {
                if (!addedSubtasks[activeGroupIdForSubtask]) addedSubtasks[activeGroupIdForSubtask] = [];
                addedSubtasks[activeGroupIdForSubtask].push({ text: subText, checked: false });
                localStorage.setItem("added_subtasks", JSON.stringify(addedSubtasks));
                
                subtaskModal.style.display = "none";
                subtaskTextInput.value = "";
                activeGroupIdForSubtask = null;
                renderCalendar();
            }
        });

        let customItems = JSON.parse(localStorage.getItem("custom_calendar_items") || "[]");
        let addedSubtasks = JSON.parse(localStorage.getItem("added_subtasks") || "{}");

        function openSubtaskModal(groupId) {
            activeGroupIdForSubtask = groupId;
            subtaskTextInput.value = "";
            subtaskModal.style.display = "flex";
            subtaskTextInput.focus();
        }

        const monthNames = [
            { num: 1, name: "Leden", days: 31 },
            { num: 2, name: "Únor", days: 28 },
            { num: 3, name: "Březen", days: 31 },
            { num: 4, name: "Duben", days: 30 },
            { num: 5, name: "Květen", days: 31 },
            { num: 6, name: "Červen", days: 30 },
            { num: 7, name: "Červenec", days: 31 },
            { num: 8, name: "Srpen", days: 31 },
            { num: 9, name: "Září", days: 30 },
            { num: 10, name: "Říjen", days: 31 },
            { num: 11, name: "Listopad", days: 30 },
            { num: 12, name: "Prosinec", days: 31 }
        ];

        function getDaysInMonth(monthNum, year) {
            if (monthNum === 2) {
                const y = parseInt(year, 10);
                return ((y % 4 === 0 && y % 100 !== 0) || y % 400 === 0) ? 29 : 28;
            }
            return monthNames[monthNum - 1].days;
        }

        function extractDateInterval(dateText) {
            if (!dateText) return null;
            
            const lower = dateText.toLowerCase();
            if (/^\d{4}$/.test(dateText.trim())) return null;
            for (let i = 0; i < monthNames.length; i++) {
                if (lower === monthNames[i].name.toLowerCase() || lower.includes(monthNames[i].name.toLowerCase() + " 20")) {
                    if (!/\d/.test(dateText)) return null;
                }
            }

            const fullRangeMatch = dateText.match(/(\d{1,2})\.\s*([0-9]{1,2})?\.\s*(?:–|-)\s*(\d{1,2})\.\s*([0-9]{1,2})\./);
            if (fullRangeMatch) {
                const startD = parseInt(fullRangeMatch[1], 10);
                const startM = fullRangeMatch[2] ? parseInt(fullRangeMatch[2], 10) : parseInt(fullRangeMatch[4], 10);
                const endD = parseInt(fullRangeMatch[3], 10);
                const endM = parseInt(fullRangeMatch[4], 10);
                return { startDay: startD, endDay: endD, month: startM, endMonth: endM };
            }

            const rangeMatch = dateText.match(/(\d{1,2})\.\s*(?:–|-)\s*(\d{1,2})\.\s*([0-9]{1,2})\./);
            if (rangeMatch) {
                const m = parseInt(rangeMatch[3], 10);
                return { startDay: parseInt(rangeMatch[1], 10), endDay: parseInt(rangeMatch[2], 10), month: m, endMonth: m };
            }

            const matchSingle = dateText.match(/(\d{1,2})\.\s*(\d{1,2})\./);
            if (matchSingle) {
                const d = parseInt(matchSingle[1], 10);
                const m = parseInt(matchSingle[2], 10);
                return { startDay: d, endDay: d, month: m, endMonth: m };
            }

            for (let i = 0; i < monthNames.length; i++) {
                if (dateText.toLowerCase().includes(monthNames[i].name.toLowerCase())) {
                    const cleanText = dateText.toLowerCase().replace(/20\d\d/g, "").trim();
                    if (cleanText === monthNames[i].name.toLowerCase()) {
                        return null;
                    }

                    let endMNum = monthNames[i].num;
                    for (let j = 0; j < monthNames.length; j++) {
                        if (dateText.toLowerCase().includes(monthNames[j].name.toLowerCase())) {
                            endMNum = Math.max(endMNum, monthNames[j].num);
                        }
                    }
                    return { startDay: 1, endDay: monthNames[endMNum - 1].days, month: monthNames[i].num, endMonth: endMNum };
                }
            }
            return null;
        }

        function extractDateInfo(dateText) {
            const interval = extractDateInterval(dateText);
            if (interval) return { day: interval.startDay, month: interval.month };
            
            for (let i = 0; i < monthNames.length; i++) {
                if (dateText.toLowerCase().includes(monthNames[i].name.toLowerCase())) {
                    return { day: 1, month: monthNames[i].num };
                }
            }
            return { day: 1, month: 12 };
        }

        function attachTaskItemFeatures(taskItem, updateCallback, onDeleteCallback) {
            const label = taskItem.querySelector("label");
            const checkbox = taskItem.querySelector("input[type='checkbox']");
            if (!taskItem.querySelector(".edit-task-btn")) {
                const actionsDiv = document.createElement("div");
                actionsDiv.className = "task-item-actions";
                actionsDiv.style.cssText = "display: flex; gap: 4px; margin-left: auto; align-items: center;";

                const btn = document.createElement("button");
                btn.className = "edit-task-btn";
                btn.textContent = "Upravit";
                btn.style.cssText = "background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent-blue); color: var(--accent-blue); white-space: nowrap;";

                const delBtn = document.createElement("button");
                delBtn.textContent = "✕";
                delBtn.className = "delete-task-btn";
                delBtn.style.cssText = "display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; white-space: nowrap;";

                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const isEditable = label.getAttribute("contenteditable") === "true";
                    if (isEditable) {
                        label.setAttribute("contenteditable", "false");
                        label.style.borderBottom = "none";
                        btn.textContent = "Upravit";
                        delBtn.style.display = "none";
                        if (checkbox) checkbox.disabled = false;
                        if (updateCallback) updateCallback(label.textContent);
                    } else {
                        label.setAttribute("contenteditable", "true");
                        label.style.borderBottom = "1px dashed var(--accent-blue)";
                        label.focus();
                        btn.textContent = "Uložit";
                        delBtn.style.display = "inline-block";
                        if (checkbox) checkbox.disabled = true;
                    }
                });

                delBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (confirm("Opravdu chceš smazat tento úkol?")) {
                        if (onDeleteCallback) onDeleteCallback();
                    }
                });

                actionsDiv.appendChild(btn);
                actionsDiv.appendChild(delBtn);
                taskItem.appendChild(actionsDiv);
            }
        }

        function renderCalendar() {
            const container = document.getElementById("calendarContainer");
            
            const headerEl = container.querySelector("header");
            container.innerHTML = "";
            container.appendChild(headerEl);

            const allYearsSet = new Set(["2026", "2027", "2028"]);
            customItems.forEach(item => { if (item.year) allYearsSet.add(item.year); });

            const sortedYears = Array.from(allYearsSet).sort((a, b) => parseInt(a) - parseInt(b));
            const activeMonthsByYear = {};

            sortedYears.forEach(y => {
                activeMonthsByYear[y] = new Set();
                const yearSec = document.createElement("div");
                yearSec.className = "year-section";
                yearSec.setAttribute("data-year", y);
                yearSec.innerHTML = `
                    <div class="year-title">${y}</div>
                    <div class="months-container"></div>
                `;
                container.appendChild(yearSec);
            });

            const yearSections = document.querySelectorAll(".year-section");

            function registerMonth(year, dateStr) {
                const dateInfo = extractDateInfo(dateStr);
                if (dateInfo.month >= 1 && dateInfo.month <= 12) {
                    if (activeMonthsByYear[year]) {
                        activeMonthsByYear[year].add(dateInfo.month);
                    }
                }
            }

            customItems.forEach((item) => { registerMonth(item.year, item.date); });

            yearSections.forEach(yearSec => {
                const yearStr = yearSec.getAttribute("data-year");
                const monthsContainer = yearSec.querySelector(".months-container");
                monthsContainer.innerHTML = "";

                for (let m = 1; m <= 12; m++) {
                    if (activeMonthsByYear[yearStr].has(m)) {
                        const monthObj = monthNames.find(mn => mn.num === m);
                        const monthSec = document.createElement("div");
                        monthSec.className = "month-section";
                        monthSec.setAttribute("data-month-num", m);
                        monthSec.innerHTML = `<div class="month-title">📆 ${monthObj.name}</div>`;
                        monthsContainer.appendChild(monthSec);
                    }
                }
                yearSec.style.display = monthsContainer.children.length === 0 ? "none" : "block";
            });

            const monthItemsMap = {};

            function addGroupToMap(year, monthNum, dayNum, groupDiv) {
                const key = `${year}-${monthNum}`;
                if (!monthItemsMap[key]) monthItemsMap[key] = [];
                monthItemsMap[key].push({ element: groupDiv, day: dayNum });
            }

            customItems.forEach((item, index) => {
                const yearSec = Array.from(document.querySelectorAll(".year-section")).find(sec => sec.getAttribute("data-year") === item.year);
                if (!yearSec) return;

                const dateInfo = extractDateInfo(item.date);
                let targetMonthSec = yearSec.querySelector(`.months-container .month-section[data-month-num="${dateInfo.month}"]`);
                if (!targetMonthSec) {
                    const monthObj = monthNames.find(mn => mn.num === dateInfo.month);
                    const monthSec = document.createElement("div");
                    monthSec.className = "month-section";
                    monthSec.setAttribute("data-month-num", dateInfo.month);
                    monthSec.innerHTML = `<div class="month-title">📆 ${monthObj.name}</div>`;
                    yearSec.querySelector(".months-container").appendChild(monthSec);
                    yearSec.style.display = "block";
                    targetMonthSec = monthSec;
                }

                const groupDiv = document.createElement("div");
                groupDiv.className = "item-group custom-injected" + (item.highlighted ? " highlighted-event" : "");
                const customGroupId = "custom_" + index;
                groupDiv.setAttribute("data-group-id", customGroupId);

                let innerContent = `
                    <div class="event-main-row">
                        <span class="event-date-badge editable-date" style="cursor: pointer;" title="Kliknutím upravíš datum">${item.date}</span>
                        <span class="editable-text">${item.title}</span>
                    </div>
                    <div class="event-sub-row">
                        <button class="add-subtask-btn" style="background: rgba(250, 204, 21, 0.15); border: 1px solid var(--accent-pink); color: var(--accent-pink); white-space: nowrap;">+ Úkol</button>
                        <button class="edit-group-btn" style="background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent-blue); color: var(--accent-blue); white-space: nowrap;">Upravit</button>
                        <button class="delete-custom-btn" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; white-space: nowrap;">✕ Smazat</button>
                    </div>
                    <ul class="task-list">`;

                if (item.type === "task" && item.task) {
                    innerContent += `
                        <li class="task-item custom-main-task">
                            <input type="checkbox" id="custom_task_${index}" ${item.checked ? 'checked' : ''}>
                            <label for="custom_task_${index}">${item.task}</label>
                        </li>`;
                }

                if (addedSubtasks[customGroupId]) {
                    addedSubtasks[customGroupId].forEach((sub, subIdx) => {
                        innerContent += `
                            <li class="task-item" data-sub-id="${customGroupId}_${subIdx}">
                                <input type="checkbox" id="sub_${customGroupId}_${subIdx}" ${sub.checked ? 'checked' : ''}>
                                <label for="sub_${customGroupId}_${subIdx}">${sub.text}</label>
                            </li>`;
                    });
                }

                innerContent += `</ul>`;
                groupDiv.innerHTML = innerContent;

                if (item.type === "task" && item.task) {
                    const cb = groupDiv.querySelector("input[type='checkbox']");
                    cb.addEventListener("change", () => {
                        customItems[index].checked = cb.checked;
                        localStorage.setItem("custom_calendar_items", JSON.stringify(customItems));
                    });

                    const mainTaskLi = groupDiv.querySelector(".custom-main-task");
                    attachTaskItemFeatures(mainTaskLi, (newText) => {
                        customItems[index].task = newText;
                        localStorage.setItem("custom_calendar_items", JSON.stringify(customItems));
                    }, () => {
                        customItems[index].task = "";
                        localStorage.setItem("custom_calendar_items", JSON.stringify(customItems));
                        renderCalendar();
                    });
                }

                groupDiv.querySelector(".add-subtask-btn").addEventListener("click", (e) => {
                    e.stopPropagation();
                    openSubtaskModal(customGroupId);
                });

                groupDiv.querySelectorAll(".task-list .task-item[data-sub-id]").forEach((li, subIdx) => {
                    attachTaskItemFeatures(li, (newText) => {
                        addedSubtasks[customGroupId][subIdx].text = newText;
                        localStorage.setItem("added_subtasks", JSON.stringify(addedSubtasks));
                    }, () => {
                        addedSubtasks[customGroupId].splice(subIdx, 1);
                        if (addedSubtasks[customGroupId].length === 0) delete addedSubtasks[customGroupId];
                        localStorage.setItem("added_subtasks", JSON.stringify(addedSubtasks));
                        renderCalendar();
                    });

                    const cb = li.querySelector("input[type='checkbox']");
                    cb.addEventListener("change", () => {
                        addedSubtasks[customGroupId][subIdx].checked = cb.checked;
                        localStorage.setItem("added_subtasks", JSON.stringify(addedSubtasks));
                    });
                });

                const dateBadge = groupDiv.querySelector(".editable-date");
                const headerSpan = groupDiv.querySelector(".editable-text");
                const editGroupBtn = groupDiv.querySelector(".edit-group-btn");
                const delGroupBtn = groupDiv.querySelector(".delete-custom-btn");

                editGroupBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const isEditable = headerSpan.getAttribute("contenteditable") === "true";
                    if (isEditable) {
                        headerSpan.setAttribute("contenteditable", "false");
                        dateBadge.setAttribute("contenteditable", "false");
                        headerSpan.style.borderBottom = "none";
                        dateBadge.style.borderBottom = "none";
                        editGroupBtn.textContent = "Upravit";
                        delGroupBtn.style.display = "none";
                        customItems[index].title = headerSpan.textContent;
                        customItems[index].date = dateBadge.textContent;
                        localStorage.setItem("custom_calendar_items", JSON.stringify(customItems));
                        renderCalendar();
                    } else {
                        headerSpan.setAttribute("contenteditable", "true");
                        dateBadge.setAttribute("contenteditable", "true");
                        headerSpan.style.borderBottom = "1px dashed var(--accent-blue)";
                        dateBadge.style.borderBottom = "1px dashed var(--accent-blue)";
                        headerSpan.focus();
                        editGroupBtn.textContent = "Uložit";
                        delGroupBtn.style.display = "inline-block";
                    }
                });

                delGroupBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    if (confirm("Opravdu chceš smazat celou tuto položku?")) {
                        customItems.splice(index, 1);
                        localStorage.setItem("custom_calendar_items", JSON.stringify(customItems));
                        renderCalendar();
                    }
                });

                addGroupToMap(item.year, dateInfo.month, dateInfo.day, groupDiv);
            });

            Object.keys(monthItemsMap).forEach(key => {
                const [yStr, mStr] = key.split("-");
                const yearSec = Array.from(document.querySelectorAll(".year-section")).find(sec => sec.getAttribute("data-year") === yStr);
                if (!yearSec) return;
                const targetMonthSec = yearSec.querySelector(`.months-container .month-section[data-month-num="${mStr}"]`);
                if (!targetMonthSec) return;

                monthItemsMap[key].sort((a, b) => a.day - b.day);

                monthItemsMap[key].forEach(itemObj => {
                    targetMonthSec.appendChild(itemObj.element);
                });
            });
        }

        renderCalendar();

        analyticsBtn.addEventListener("click", () => {
            let busyDaysByMonth = {};
            const years = ["2026", "2027", "2028"];
            
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;
            const currentDay = now.getDate();

            years.forEach(year => {
                for (let m = 1; m <= 12; m++) {
                    busyDaysByMonth[`${year}-${m}`] = new Set();
                }
            });

            if (currentYear === 2026) {
                for (let m = 1; m < currentMonth; m++) {
                    const totalD = getDaysInMonth(m, "2026");
                    for (let d = 1; d <= totalD; d++) {
                        busyDaysByMonth[`2026-${m}`].add(d);
                    }
                }
                for (let d = 1; d < currentDay; d++) {
                    busyDaysByMonth[`2026-${currentMonth}`].add(d);
                }
            } else if (currentYear > 2026) {
                for (let m = 1; m <= 12; m++) {
                    const totalD = getDaysInMonth(m, "2026");
                    for (let d = 1; d <= totalD; d++) {
                        busyDaysByMonth[`2026-${m}`].add(d);
                    }
                }
            }

            function markBusyDays(year, dateText) {
                const interval = extractDateInterval(dateText);
                if (!interval) return;
                
                if (interval.endMonth && interval.endMonth !== interval.month) {
                    for (let m = interval.month; m <= interval.endMonth; m++) {
                        const key = `${year}-${m}`;
                        if (busyDaysByMonth[key]) {
                            const mDays = getDaysInMonth(m, year);
                            const startD = (m === interval.month) ? interval.startDay : 1;
                            const endD = (m === interval.endMonth) ? interval.endMonth : mDays;
                            for (let d = startD; d <= endD; d++) {
                                busyDaysByMonth[key].add(d);
                            }
                        }
                    }
                } else {
                    const key = `${year}-${interval.month}`;
                    if (busyDaysByMonth[key]) {
                        for (let d = interval.startDay; d <= interval.endDay; d++) {
                            busyDaysByMonth[key].add(d);
                        }
                    }
                }
            }

            customItems.forEach((item) => {
                markBusyDays(item.year, item.date);
            });

            let freeGapsByYear = {};

            years.forEach(year => {
                freeGapsByYear[year] = [];
                for (let m = 1; m <= 12; m++) {
                    const key = `${year}-${m}`;
                    const totalDays = getDaysInMonth(m, year);
                    const busySet = busyDaysByMonth[key];
                    const monthObj = monthNames.find(mn => mn.num === m);

                    let currentGapStart = null;
                    for (let day = 1; day <= totalDays; day++) {
                        if (!busySet.has(day)) {
                            if (currentGapStart === null) currentGapStart = day;
                        } else {
                            if (currentGapStart !== null) {
                                let gapLength = day - currentGapStart;
                                if (gapLength >= 3) {
                                    freeGapsByYear[year].push({ start: currentGapStart, end: day - 1, monthName: monthObj.name });
                                }
                                currentGapStart = null;
                            }
                        }
                    }
                    if (currentGapStart !== null) {
                        let gapLength = (totalDays + 1) - currentGapStart;
                        if (gapLength >= 3) {
                            freeGapsByYear[year].push({ start: currentGapStart, end: totalDays, monthName: monthObj.name });
                        }
                    }
                }
            });

            let html = `<div style="display: flex; flex-direction: column; gap: 8px;">`;

            years.forEach(year => {
                const gaps = freeGapsByYear[year] || [];
                html += `
                    <div style="background: #18181b; border: 1px solid #3f3f46; border-radius: 8px; overflow: hidden;">
                        <div class="accordion-header" data-year-target="${year}" style="padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: #f43f5e; font-size: 0.95rem; user-select: none; outline: none;">
                            <span style="display: flex; align-items: center; gap: 8px; color: #ffffff;">📁 Rok ${year} <span style="color: var(--text-muted); font-weight: normal; font-size: 0.85rem;">(${gaps.length} volných oken)</span></span>
                            <span class="accordion-arrow" style="color: #a1a1aa; font-size: 0.8rem;">▼</span>
                        </div>
                        <div class="accordion-content" id="year_content_${year}" style="display: none; padding: 0 14px 12px 14px; font-size: 0.9rem; color: var(--text-color); border-top: 1px solid #27272a;">
                            ${gaps.length > 0 ? gaps.map(g => `<div style="margin-top: 6px; color: #e4e4e7;">• <strong>${g.start}. — ${g.end}. ${g.monthName}</strong></div>`).join("") : "<div style='margin-top: 6px; color: var(--text-muted);'>Žádná delší volná okna v tomto roce.</div>"}
                        </div>
                    </div>`;
            });

            html += `</div>`;

            analyticsContent.innerHTML = html;

            analyticsContent.querySelectorAll(".accordion-header").forEach(header => {
                header.addEventListener("click", () => {
                    const targetYear = header.getAttribute("data-year-target");
                    const content = document.getElementById("year_content_" + targetYear);
                    const arrow = header.querySelector(".accordion-arrow");
                    if (content.style.display === "none") {
                        content.style.display = "block";
                        if (arrow) arrow.textContent = "▲";
                    } else {
                        content.style.display = "none";
                        if (arrow) arrow.textContent = "▼";
                    }
                });
            });

            analyticsModal.style.display = "flex";
        });

        let dpState = {
            isOpen: false,
            mode: 'single',
            year: 2026,
            month: 8,
            singleDate: { day: 17, month: 9, year: 2026 },
            rangeStart: null,
            rangeEnd: null
        };

        const dpTrigger = document.getElementById("dpTrigger");
        const dpDropdown = document.getElementById("dpDropdown");
        const dpMonthYearText = document.getElementById("dpMonthYearText");
        const dpGrid = document.getElementById("dpGrid");
        const dpModeSingle = document.getElementById("dpModeSingle");
        const dpModeRange = document.getElementById("dpModeRange");
        const dpApplyBtn = document.getElementById("dpApplyBtn");
        const dpPrevBtn = document.getElementById("dpPrevBtn");
        const dpNextBtn = document.getElementById("dpNextBtn");
        const modalEventDateInput = document.getElementById("modalEventDate");

        function updateTriggerText() {
            if (dpState.mode === 'single') {
                dpTrigger.textContent = `${dpState.singleDate.day}. ${dpState.singleDate.month}. ${dpState.singleDate.year}`;
                modalEventDateInput.value = `${dpState.singleDate.day}. ${dpState.singleDate.month}.`;
                modalEventDateInput.setAttribute("data-selected-year", dpState.singleDate.year);
            } else {
                if (dpState.rangeStart && dpState.rangeEnd) {
                    dpTrigger.textContent = `${dpState.rangeStart.day}. ${dpState.rangeStart.month}. — ${dpState.rangeEnd.day}. ${dpState.rangeEnd.month}. ${dpState.rangeEnd.year}`;
                    modalEventDateInput.value = `${dpState.rangeStart.day}.–${dpState.rangeEnd.day}. ${dpState.rangeEnd.month}.`;
                    modalEventDateInput.setAttribute("data-selected-year", dpState.rangeEnd.year);
                } else if (dpState.rangeStart) {
                    dpTrigger.textContent = `${dpState.rangeStart.day}. ${dpState.rangeStart.month}. — vyberte konec`;
                    modalEventDateInput.value = `${dpState.rangeStart.day}. ${dpState.rangeStart.month}.`;
                    modalEventDateInput.setAttribute("data-selected-year", dpState.rangeStart.year);
                } else {
                    dpTrigger.textContent = "Vyberte rozmezí od–do";
                    modalEventDateInput.value = "";
                    modalEventDateInput.setAttribute("data-selected-year", dpState.year);
                }
            }
        }

        function renderDatePickerGrid() {
            const cMonthObj = monthNames[dpState.month];
            dpMonthYearText.textContent = `${cMonthObj.name} ${dpState.year}`;
            dpGrid.innerHTML = "";

            const firstDayIndex = (new Date(dpState.year, dpState.month, 1).getDay() + 6) % 7; 
            const daysInCurrMonth = getDaysInMonth(dpState.month + 1, dpState.year);
            const prevMonthDays = dpState.month === 0 ? getDaysInMonth(12, dpState.year - 1) : getDaysInMonth(dpState.month, dpState.year);

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                const btn = document.createElement("button");
                btn.className = "dp-day muted";
                btn.textContent = dayNum;
                btn.addEventListener("click", () => {
                    dpState.month = dpState.month === 0 ? 11 : dpState.month - 1;
                    if (dpState.month === 11) dpState.year--;
                    renderDatePickerGrid();
                });
                dpGrid.appendChild(btn);
            }

            for (let d = 1; d <= daysInCurrMonth; d++) {
                const btn = document.createElement("button");
                btn.className = "dp-day";
                btn.textContent = d;

                const curY = dpState.year;
                const curM = dpState.month + 1;

                if (dpState.mode === 'single') {
                    if (dpState.singleDate.day === d && dpState.singleDate.month === curM && dpState.singleDate.year === curY) {
                        btn.classList.add("selected");
                    }
                    btn.addEventListener("click", () => {
                        dpState.singleDate = { day: d, month: curM, year: curY };
                        updateTriggerText();
                        renderDatePickerGrid();
                    });
                } else {
                    const timeVal = new Date(curY, dpState.month, d).getTime();
                    let startTime = dpState.rangeStart ? new Date(dpState.rangeStart.year, dpState.rangeStart.month - 1, dpState.rangeStart.day).getTime() : null;
                    let endTime = dpState.rangeEnd ? new Date(dpState.rangeEnd.year, dpState.rangeEnd.month - 1, dpState.rangeEnd.day).getTime() : null;

                    if (startTime && timeVal === startTime) btn.classList.add("range-start");
                    if (endTime && timeVal === endTime) btn.classList.add("range-end");
                    if (startTime && endTime && timeVal > startTime && timeVal < endTime) btn.classList.add("in-range");

                    btn.addEventListener("click", () => {
                        if (!dpState.rangeStart || (dpState.rangeStart && dpState.rangeEnd)) {
                            dpState.rangeStart = { day: d, month: curM, year: curY };
                            dpState.rangeEnd = null;
                        } else {
                            const stTime = new Date(dpState.rangeStart.year, dpState.rangeStart.month - 1, dpState.rangeStart.day).getTime();
                            if (timeVal < stTime) {
                                dpState.rangeStart = { day: d, month: curM, year: curY };
                            } else {
                                dpState.rangeEnd = { day: d, month: curM, year: curY };
                            }
                        }
                        updateTriggerText();
                        renderDatePickerGrid();
                    });
                }

                dpGrid.appendChild(btn);
            }

            const totalRendered = firstDayIndex + daysInCurrMonth;
            const remainingCells = totalRendered <= 35 ? 35 - totalRendered : 42 - totalRendered;
            for (let d = 1; d <= remainingCells; d++) {
                const btn = document.createElement("button");
                btn.className = "dp-day muted";
                btn.textContent = d;
                btn.addEventListener("click", () => {
                    dpState.month = dpState.month === 11 ? 0 : dpState.month + 1;
                    if (dpState.month === 0) dpState.year++;
                    renderDatePickerGrid();
                });
                dpGrid.appendChild(btn);
            }
        }

        dpTrigger.addEventListener("click", (e) => {
            e.stopPropagation();
            dpState.isOpen = !dpState.isOpen;
            dpDropdown.style.display = dpState.isOpen ? "block" : "none";
            if (dpState.isOpen) renderDatePickerGrid();
        });

        document.addEventListener("click", (e) => {
            if (!document.getElementById("datePickerWrapper").contains(e.target)) {
                dpState.isOpen = false;
                dpDropdown.style.display = "none";
            }
        });

        dpModeSingle.addEventListener("click", () => {
            dpState.mode = 'single';
            dpModeSingle.classList.add("active");
            dpModeRange.classList.remove("active");
            renderDatePickerGrid();
            updateTriggerText();
        });

        dpModeRange.addEventListener("click", () => {
            dpState.mode = 'range';
            dpModeRange.classList.add("active");
            dpModeSingle.classList.remove("active");
            renderDatePickerGrid();
            updateTriggerText();
        });

        dpPrevBtn.addEventListener("click", () => {
            dpState.month--;
            if (dpState.month < 0) {
                dpState.month = 11;
                dpState.year--;
            }
            renderDatePickerGrid();
        });

        dpNextBtn.addEventListener("click", () => {
            dpState.month++;
            if (dpState.month > 11) {
                dpState.month = 0;
                dpState.year++;
            }
            renderDatePickerGrid();
        });

        dpApplyBtn.addEventListener("click", () => {
            dpState.isOpen = false;
            dpDropdown.style.display = "none";
        });

        updateTriggerText();

        modalSave.addEventListener("click", () => {
            const type = document.getElementById("modalType").value;
            const year = modalEventDateInput.getAttribute("data-selected-year") || "2026";
            const date = modalEventDateInput.value.trim();
            const title = document.getElementById("modalEventTitle").value.trim();
            const task = document.getElementById("modalTaskText").value.trim();
            const highlighted = document.getElementById("modalHighlight").checked;

            if (!date) {
                alert("Vyplňte prosím datum.");
                return;
            }

            customItems.push({
                type: type, year: year, date: date, title: title,
                task: type === "task" ? task : "",
                checked: false, highlighted: highlighted
            });

            localStorage.setItem("custom_calendar_items", JSON.stringify(customItems));
            renderCalendar();

            document.getElementById("modalEventTitle").value = "";
            document.getElementById("modalTaskText").value = "";
            document.getElementById("modalType").value = "event";
            document.getElementById("modalHighlight").checked = false;
            taskFieldContainer.style.display = "none";
            addModal.style.display = "none";
        });
    });
</script>

<div id="addModal" class="modal-overlay">
    <div class="modal-box">
        <h2>Přidat novou položku</h2>
        <div style="margin-bottom: 12px;">
            <label>Typ:</label>
            <select id="modalType">
                <option value="event">Událost (bez okénka)</option>
                <option value="task">Úkol (s okénkem k odškrtnutí)</option>
            </select>
        </div>
        <div style="margin-bottom: 12px;">
            <label>Datum / rozmezí:</label>
            <div class="date-picker-wrapper" id="datePickerWrapper">
                <button type="button" class="date-input-trigger" id="dpTrigger">17. 9. 2026 <span>📅</span></button>
                <div class="date-picker-dropdown" id="dpDropdown">
                    <div class="dp-header">
                        <button type="button" class="dp-nav-btn" id="dpPrevBtn">&lt;</button>
                        <span id="dpMonthYearText">Září 2026</span>
                        <button type="button" class="dp-nav-btn" id="dpNextBtn">&gt;</button>
                    </div>
                    <div class="dp-mode-switch">
                        <button type="button" class="dp-mode-btn active" id="dpModeSingle">Jedno datum</button>
                        <button type="button" class="dp-mode-btn" id="dpModeRange">Rozmezí (Od–Do)</button>
                    </div>
                    <div class="dp-weekdays">
                        <span>Po</span><span>Út</span><span>St</span><span>Čt</span><span>Pá</span><span>So</span><span>Ne</span>
                    </div>
                    <div class="dp-grid" id="dpGrid"></div>
                    <div class="dp-footer">
                        <span style="font-size: 0.8rem; color: var(--text-muted);">Vyberte kliknutím</span>
                        <button type="button" class="dp-apply-btn" id="dpApplyBtn">Hotovo</button>
                    </div>
                </div>
            </div>
            <input type="hidden" id="modalEventDate" value="17. 9." data-selected-year="2026">
        </div>
        <div style="margin-bottom: 12px;">
            <label>Název události / hry (volitelně):</label>
            <input type="text" id="modalEventTitle" placeholder="např. Výlet do lesa ✨">
        </div>
        <div id="taskFieldContainer" style="margin-bottom: 12px; display: none;">
            <label>Název úkolu (odškrtávací položka):</label>
            <input type="text" id="modalTaskText" placeholder="např. Koupit lístky...">
        </div>
        <div style="margin-bottom: 16px; display: flex; align-items: center; gap: 10px;">
            <input type="checkbox" id="modalHighlight" style="width: 20px; height: 20px; accent-color: var(--accent-pink); cursor: pointer;">
            <label for="modalHighlight" style="margin-bottom: 0; cursor: pointer; user-select: none;">Zvýrazněná událost (barevné pozadí / záře)</label>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
            <button id="modalCancel" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;">Zrušit</button>
            <button id="modalSave" style="background: var(--accent-pink); color: #000000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">Uložit</button>
        </div>
    </div>
</div>

<div id="subtaskModal" class="modal-overlay">
    <div class="modal-box" style="max-width: 400px;">
        <h2>Přidat nový úkol</h2>
        <div style="margin-bottom: 12px;">
            <label>Zadej název nového úkolu:</label>
            <input type="text" id="subtaskTextInput" placeholder="např. Koupit lístky...">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
            <button id="subtaskCancel" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;">Zrušit</button>
            <button id="subtaskSave" style="background: var(--accent-pink); color: #000000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">Přidat</button>
        </div>
    </div>
</div>

<div id="analyticsModal" class="modal-overlay">
    <div class="modal-box" style="max-width: 480px; max-height: 85vh; display: flex; flex-direction: column;">
        <h2>Volná okna v kalendáři</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0; margin-bottom: 14px;">Kliknutím na rok rozbalíš měsíce s největším klidem.</p>
        <div id="analyticsContent" style="overflow-y: auto; flex-grow: 1; padding-right: 4px; margin-bottom: 16px;"></div>
        <div style="display: flex; justify-content: flex-end;">
            <button id="analyticsClose" style="background: var(--accent-pink); color: #000000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; width: 100%;">Zavřít</button>
        </div>
    </div>
</div>

</body>
</html>
